<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2620"/><stop offset=".62" stop-color="#3a2d22"/><stop offset="1" stop-color="#1a1410"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d14"/><stop offset="1" stop-color="#0d0907"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5232"/><stop offset="1" stop-color="#3f2814"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3e46"/><stop offset="1" stop-color="#17181c"/></linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3424"/><stop offset="1" stop-color="#21160e"/></linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"/><stop offset=".55" stop-color="#ffb35c" stop-opacity=".16"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>
  <!-- panelled wall -->
  <g fill="none" stroke="#000" stroke-opacity=".18" stroke-width="3">
    <rect x="70" y="380" width="250" height="150" rx="4"/><rect x="880" y="380" width="250" height="150" rx="4"/>
  </g>
  <rect y="372" width="1200" height="6" fill="#000" opacity=".2"/>
  <!-- framed picture and a sideboard -->
  <rect x="140" y="150" width="190" height="140" rx="4" fill="#15100c"/><rect x="152" y="162" width="166" height="116" fill="#3c4a52"/>
  <path d="M152 250c30-30 60-22 84-40 22 16 50 10 82 30v38H152z" fill="#24323a"/><circle cx="280" cy="196" r="12" fill="#d8c59a" opacity=".55"/>
  <!-- plant -->
  <rect x="980" y="470" width="70" height="80" rx="8" fill="#2a211a"/>
  <g fill="#2e4a2f"><path d="M1015 470c-40-60-60-110-40-160 30 40 40 100 40 160z"/><path d="M1015 470c10-70 40-120 80-140-10 60-40 110-80 140z"/><path d="M1015 470c-10-50 0-100 20-130 14 40 6 90-20 130z" fill="#3b5d3a"/></g>
  <!-- floor -->
  <rect y="560" width="1200" height="240" fill="url(#floor)"/>
  <rect y="556" width="1200" height="6" fill="#000" opacity=".4"/>
  <!-- light pool on the table (soft; the widget adds the live glow) -->
  <ellipse cx="600" cy="520" rx="420" ry="190" fill="url(#pool)"/>
  <!-- chairs behind the table -->
  <g fill="url(#chair)"><rect x="330" y="420" width="120" height="130" rx="18"/><rect x="750" y="420" width="120" height="130" rx="18"/></g>
  <!-- table -->
  <rect x="250" y="530" width="700" height="26" rx="8" fill="url(#table)"/>
  <rect x="250" y="552" width="700" height="10" rx="4" fill="#26180c"/>
  <g fill="#2b1b0d"><rect x="300" y="560" width="18" height="160"/><rect x="882" y="560" width="18" height="160"/></g>
  <!-- tableware -->
  <ellipse cx="600" cy="528" rx="70" ry="10" fill="#e8dccb" opacity=".85"/><ellipse cx="600" cy="526" rx="40" ry="6" fill="#cdbfab"/>
  <rect x="452" y="488" width="14" height="40" rx="5" fill="#b9d2d6" opacity=".55"/><rect x="738" y="492" width="14" height="36" rx="5" fill="#b9d2d6" opacity=".55"/>
  <!-- pendant -->
  <rect x="598" y="0" width="4" height="190" fill="#2a2a2e"/>
  <rect x="584" y="184" width="32" height="22" rx="6" fill="#26272c"/>
  <path d="M470 312c0-70 58-112 130-112s130 42 130 112z" fill="url(#shade)"/>
  <path d="M492 290c14-46 52-74 102-78" stroke="#565a64" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="466" y="308" width="268" height="8" rx="4" fill="#2c2e34"/>
  <ellipse cx="600" cy="314" rx="110" ry="9" fill="#fff1d6" opacity=".55"/>
  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
