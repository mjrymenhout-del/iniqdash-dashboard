    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16243b"/><stop offset="1" stop-color="#0a1220"/></linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a513d"/><stop offset="1" stop-color="#3a2a1d"/></linearGradient>
