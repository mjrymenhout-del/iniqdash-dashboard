# DRAFT — routing checked on a host Nginx 1.24 + PHP-FPM 8.3 over plain HTTP (2026-11-05); never run in a Home Assistant App. The gate routing inside the container (plain HTTP from Home Assistant's ingress proxy on port 8099).
server {
    listen 8099;
    root /var/www/iniqdash;
    client_max_body_size 16m;
    location ~ /\.          { return 404; }
    location ^~ /server/    { return 404; }
    location ^~ /tests/     { return 404; }
    location = /login.php   { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/login.php;  fastcgi_param SCRIPT_NAME /login.php;  fastcgi_pass 127.0.0.1:9000; }
    location = /logout.php  { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/logout.php; fastcgi_param SCRIPT_NAME /logout.php; fastcgi_pass 127.0.0.1:9000; }
    location / { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/gate.php; fastcgi_param SCRIPT_NAME /gate.php; fastcgi_pass 127.0.0.1:9000; }
}
