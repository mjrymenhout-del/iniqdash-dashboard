# IniqDash on Apache — EXAMPLE virtual host (not tested on a clean server; adapt paths, names and TLS).
# The shipped .htaccess does the routing: every request goes through gate.php except login.php / logout.php; server/ and dotfiles are
# refused. It needs mod_rewrite and AllowOverride for the IniqDash folder. Without mod_rewrite the .htaccess refuses everything.
<VirtualHost *:443>
    ServerName dash.example.com
    DocumentRoot /var/www/iniqdash

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/dash.example.com.pem
    SSLCertificateKeyFile /etc/ssl/private/dash.example.com.key

    <Directory /var/www/iniqdash>
        # the shipped .htaccess does the routing and refusals (Apache allows no comment after a directive)
        AllowOverride All
        Require all granted
        Options -Indexes -MultiViews
    </Directory>
    # never serve these, even if .htaccess were missing
    <DirectoryMatch "^/var/www/iniqdash/(server|tests|\.git)">
        Require all denied
    </DirectoryMatch>

    # uploads (images): PHP's upload_max_filesize / post_max_size must allow them (IniqDash limits images itself)
    php_value upload_max_filesize 12M
    php_value post_max_size 16M
</VirtualHost>
# The private folder (dashboards, uploads, the Home Assistant token) is OUTSIDE /var/www — see docs/STANDALONE-INSTALL.md.
