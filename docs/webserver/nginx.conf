# IniqDash on Nginx + PHP-FPM — EXAMPLE (tested on a clean Ubuntu 24.04 / Nginx 1.24 / PHP-FPM 8.3 container, 2026-11-05; adapt paths, names, the PHP-FPM socket and TLS).
# It must do what the shipped .htaccess does: EVERY request goes to gate.php (which checks the session and serves files), except
# login.php and logout.php; server/, tests/ and dotfiles are never served. Run tests/security.mjs-style checks against it before use.
server {
    listen 443 ssl;
    # HTTP/2 (optional): Nginx >= 1.25.1 -> add the line `http2 on;`; older Nginx (e.g. 1.24 in Ubuntu 24.04) -> `listen 443 ssl http2;`
    server_name dash.example.com;
    root /var/www/iniqdash;

    ssl_certificate     /etc/ssl/certs/dash.example.com.pem;
    ssl_certificate_key /etc/ssl/private/dash.example.com.key;

    client_max_body_size 16m;                     # image uploads (IniqDash validates and limits them itself)
    autoindex off;

    # never: dotfiles, server code, tests
    location ~ /\.                     { return 404; }
    location ^~ /server/               { return 404; }
    location ^~ /tests/                { return 404; }

    # the only public entry points
    location = /login.php  { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/login.php;  fastcgi_param SCRIPT_NAME /login.php;  fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
    location = /logout.php { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/logout.php; fastcgi_param SCRIPT_NAME /logout.php; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }

    # everything else (pages, scripts, styles, images, api/*.php): through the gate — never served directly
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/gate.php;
        fastcgi_param SCRIPT_NAME     /gate.php;          # IniqDash derives its base path from SCRIPT_NAME
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
server { listen 80; server_name dash.example.com; return 301 https://$host$request_uri; }
# Installing IniqDash under a sub-path (e.g. /dash/) needs SCRIPT_NAME /dash/gate.php and matching locations — untested.
