# IniqDash behind a TLS-terminating Nginx reverse proxy — EXAMPLE (tested in a clean container, see docs/STANDALONE-INSTALL.md).
# The proxy holds the certificate; IniqDash runs on a backend web server (Apache or Nginx + PHP-FPM, as in the other examples) that
# listens on 127.0.0.1 only, without TLS. The backend must believe the proxy's forwarding headers, and ONLY the proxy's:
#   server/local.php →  return ['private_dir' => '…', 'trusted_proxies' => ['127.0.0.1']];
# (If the backend is reachable directly by anyone else, it still refuses plain HTTP: their forwarding headers are ignored.)
server {
    listen 443 ssl;
    server_name dash.example.com;
    ssl_certificate     /etc/ssl/certs/dash.example.com.pem;
    ssl_certificate_key /etc/ssl/private/dash.example.com.key;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $http_host;                    # as the browser sent it, with any port: the same-origin check compares Origin with Host
        proxy_set_header X-Forwarded-Proto $scheme;                       # overwritten, never passed through from the client
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;    # IniqDash takes the right-most untrusted address
        proxy_redirect off;
    }
}
server { listen 80; server_name dash.example.com; return 301 https://$host$request_uri; }
